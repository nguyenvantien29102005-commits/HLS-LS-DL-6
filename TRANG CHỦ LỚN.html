<script>
/* ============================================================
   ============================================================
   KHU VỰC THAY ĐỔI LINK
   CHỈ CẦN SỬA 2 DÒNG NÀY
   ============================================================
   ============================================================ */

const HISTORY_LINK = "lich-su.html";
const GEOGRAPHY_LINK = "dia-ly.html";


/* ============================================================
   ELEMENTS
============================================================ */

const homeScreen =
  document.getElementById("homeScreen");

const subjectScreen =
  document.getElementById("subjectScreen");

const exploreBtn =
  document.getElementById("exploreBtn");

const backBtn =
  document.getElementById("backBtn");

const flash =
  document.getElementById("flash");

const cards =
  document.querySelectorAll(".subject-card");

const particleLayer =
  document.getElementById("particles");


/* ============================================================
   TRẠNG THÁI ĐANG CHUYỂN TRANG
============================================================ */

let isNavigating = false;


/* ============================================================
   PARTICLES
============================================================ */

const PARTICLE_COUNT = 38;

/*
  Tránh tạo particle lặp lại nếu trình duyệt
  phục hồi trang từ bộ nhớ.
*/

if (
  particleLayer &&
  particleLayer.children.length === 0
) {

  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const particle =
      document.createElement("span");

    particle.className =
      "particle";


    particle.style.setProperty(
      "--size",
      `${Math.random() * 2.3 + 0.8}px`
    );


    particle.style.setProperty(
      "--x",
      `${Math.random() * 100}%`
    );


    particle.style.setProperty(
      "--y",
      `${Math.random() * 100}%`
    );


    particle.style.setProperty(
      "--opacity",
      Math.random() * 0.42 + 0.08
    );


    particle.style.setProperty(
      "--duration",
      `${Math.random() * 8 + 6}s`
    );


    particle.style.setProperty(
      "--delay",
      `${Math.random() * -10}s`
    );


    particle.style.setProperty(
      "--moveX",
      `${Math.random() * 50 - 25}px`
    );


    particle.style.setProperty(
      "--moveY",
      `${Math.random() * 60 - 30}px`
    );


    particleLayer.appendChild(
      particle
    );

  }

}


/* ============================================================
   RESET CARD
   QUAN TRỌNG: SỬA LỖI QUAY LẠI KHÔNG HIỆN
============================================================ */

function resetCards() {

  cards.forEach(card => {

    /*
      Xóa class làm card biến mất.
    */

    card.classList.remove(
      "clicked"
    );


    /*
      Xóa transform được tạo
      bởi hiệu ứng nghiêng chuột.
    */

    card.style.transform = "";


    /*
      Reset các thuộc tính an toàn.
    */

    card.style.opacity = "";
    card.style.filter = "";

  });

}


/* ============================================================
   RESET FLASH / RIPPLE
============================================================ */

function resetEffects() {

  if (flash) {

    flash.classList.remove(
      "active"
    );

  }


  document
    .querySelectorAll(".ripple")
    .forEach(ripple => ripple.remove());

}


/* ============================================================
   RESET TRANG
============================================================ */

function resetPageState() {

  isNavigating = false;

  resetCards();

  resetEffects();

}


/* ============================================================
   QUAN TRỌNG
   KHI DÙNG NÚT BACK CỦA TRÌNH DUYỆT
============================================================ */

/*
  pageshow chạy cả khi:
  - mở trang bình thường
  - quay lại bằng nút Back
  - trình duyệt lấy trang từ BFCache

  Đây chính là phần sửa lỗi của bạn.
*/

window.addEventListener(
  "pageshow",
  function() {

    resetPageState();

  }
);


/* ============================================================
   KHI TAB ĐƯỢC HIỆN LẠI
============================================================ */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState === "visible"
    ) {

      resetCards();

    }

  }
);


/* ============================================================
   MỞ MÀN HÌNH CHỌN MÔN
============================================================ */

function openSubjectScreen() {

  if (!homeScreen || !subjectScreen) {
    return;
  }


  homeScreen.classList.add(
    "hidden-left"
  );


  subjectScreen.classList.remove(
    "hidden-right"
  );

}


/* ============================================================
   QUAY VỀ TRANG CHỦ
============================================================ */

function backHome() {

  if (!homeScreen || !subjectScreen) {
    return;
  }


  /*
    Reset các card trước.
  */

  resetCards();


  /*
    Ẩn màn hình môn học.
  */

  subjectScreen.classList.add(
    "hidden-right"
  );


  /*
    Hiện lại màn hình chính.
  */

  homeScreen.classList.remove(
    "hidden-left"
  );

}


/* ============================================================
   NÚT KHÁM PHÁ NGAY
============================================================ */

if (exploreBtn) {

  exploreBtn.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      createRipple(
        event.clientX,
        event.clientY
      );


      openSubjectScreen();

    }
  );

}


/* ============================================================
   NÚT TRANG CHỦ
============================================================ */

if (backBtn) {

  backBtn.addEventListener(
    "click",
    function() {

      backHome();

    }
  );

}


/* ============================================================
   LẤY LINK
============================================================ */

function getSubjectLink(subject) {

  switch (subject) {

    case "history":

      return HISTORY_LINK;


    case "geography":

      return GEOGRAPHY_LINK;


    default:

      return null;

  }

}


/* ============================================================
   RIPPLE
============================================================ */

function createRipple(x, y) {

  /*
    Nếu click bằng bàn phím,
    x hoặc y có thể không tồn tại.
  */

  if (
    typeof x !== "number" ||
    typeof y !== "number"
  ) {

    return;

  }


  const ripple =
    document.createElement("span");


  ripple.className =
    "ripple";


  ripple.style.left =
    `${x}px`;


  ripple.style.top =
    `${y}px`;


  document.body.appendChild(
    ripple
  );


  setTimeout(
    () => {

      ripple.remove();

    },
    750
  );

}


/* ============================================================
   FLASH
============================================================ */

function createFlash(x, y) {

  if (!flash) {
    return;
  }


  flash.style.setProperty(
    "--fx",
    `${x}px`
  );


  flash.style.setProperty(
    "--fy",
    `${y}px`
  );


  flash.classList.remove(
    "active"
  );


  /*
    Ép trình duyệt restart animation.
  */

  void flash.offsetWidth;


  flash.classList.add(
    "active"
  );


  setTimeout(
    () => {

      flash.classList.remove(
        "active"
      );

    },
    600
  );

}


/* ============================================================
   MỞ LỊCH SỬ / ĐỊA LÝ
============================================================ */

function openSubject(
  card,
  event = null
) {

  /*
    Không cho click liên tục.
  */

  if (isNavigating) {
    return;
  }


  const subject =
    card.dataset.subject;


  const link =
    getSubjectLink(subject);


  if (!link) {

    console.warn(
      "Không tìm thấy liên kết cho:",
      subject
    );

    return;

  }


  isNavigating = true;


  const rect =
    card.getBoundingClientRect();


  /*
    Nếu click chuột thì lấy vị trí chuột.
    Nếu dùng Enter thì lấy chính giữa card.
  */

  const x =
    event &&
    typeof event.clientX === "number" &&
    event.clientX !== 0

      ? event.clientX

      : rect.left +
        rect.width / 2;


  const y =
    event &&
    typeof event.clientY === "number" &&
    event.clientY !== 0

      ? event.clientY

      : rect.top +
        rect.height / 2;


  createRipple(
    x,
    y
  );


  createFlash(
    x,
    y
  );


  /*
    Hiệu ứng card trước khi sang trang.
  */

  card.classList.add(
    "clicked"
  );


  /*
    Chuyển trang sau một khoảng rất ngắn.
  */

  setTimeout(
    () => {

      window.location.href =
        link;

    },
    380
  );

}


/* ============================================================
   CLICK CARD
============================================================ */

cards.forEach(card => {

  card.addEventListener(
    "click",
    function(event) {

      openSubject(
        this,
        event
      );

    }
  );


  /*
    Hỗ trợ Enter / Space.
  */

  card.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {

        event.preventDefault();


        openSubject(
          this
        );

      }

    }
  );

});


/* ============================================================
   3D CARD TILT
============================================================ */

cards.forEach(card => {

  card.addEventListener(
    "mousemove",
    function(event) {

      /*
        Chỉ bật trên desktop.
      */

      if (
        window.innerWidth <= 980 ||
        isNavigating
      ) {

        return;

      }


      const rect =
        this.getBoundingClientRect();


      const x =
        event.clientX -
        rect.left;


      const y =
        event.clientY -
        rect.top;


      const centerX =
        rect.width / 2;


      const centerY =
        rect.height / 2;


      const rotateY =
        (
          x -
          centerX
        ) /
        centerX *
        3.2;


      const rotateX =
        (
          y -
          centerY
        ) /
        centerY *
        -3.2;


      this.style.transform =
        `
        translateY(-11px)
        scale(1.022)
        perspective(950px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        `;

    }
  );


  card.addEventListener(
    "mouseleave",
    function() {

      /*
        Không giữ transform cũ.
      */

      if (
        !this.classList.contains(
          "clicked"
        )
      ) {

        this.style.transform =
          "";

      }

    }
  );

});


/* ============================================================
   HERO PARALLAX
============================================================ */

const world =
  document.querySelector(".world");


document.addEventListener(
  "mousemove",
  function(event) {

    if (
      !world ||
      window.innerWidth <= 980 ||
      isNavigating
    ) {

      return;

    }


    const x =
      (
        event.clientX /
        window.innerWidth -
        0.5
      ) *
      13;


    const y =
      (
        event.clientY /
        window.innerHeight -
        0.5
      ) *
      10;


    world.style.transform =
      `
      translate3d(
        ${x}px,
        ${y}px,
        0
      )
      `;

  }
);


/* ============================================================
   KHI CHUỘT RỜI KHỎI TRÌNH DUYỆT
============================================================ */

document.documentElement.addEventListener(
  "mouseleave",
  function() {

    if (world) {

      world.style.transform =
        "";

    }

  }
);


/* ============================================================
   ESC = QUAY VỀ TRANG CHỦ
============================================================ */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      backHome();

    }

  }
);


/* ============================================================
   INITIAL RESET
============================================================ */

resetPageState();

</script>
